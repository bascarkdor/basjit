<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MY_APP</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center p-4">

    <!-- Login Container -->
    <div class="w-full max-w-md bg-white border border-slate-200 rounded-2xl p-8 shadow-xl">

        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-2xl font-black text-slate-900 tracking-wider mb-2">MY_APP</h1>
            <p class="text-sm text-slate-500">Welcome back! Please enter your details.</p>
        </div>

        <!-- Form -->
        <form action="{{ url_for('admin.login') }}" method="POST" class="space-y-5">

            <!-- Email Input -->
            <div>
                <label for="email" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">
                    Email Address
                </label>
                <div class="relative">
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                        placeholder="admin@example.com"
                        class="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl text-slate-900 placeholder-slate-400 focus:outline-none focus:border-slate-900 focus:ring-1 focus:ring-slate-900 focus:bg-white transition-colors"
                    >
                </div>
            </div>

            <!-- Password Input -->
            <div>
                <div class="flex items-center justify-between mb-2">
                    <label for="password" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider">
                        Password
                    </label>
                    <a href="#" class="text-xs text-slate-500 hover:text-slate-900 transition-colors">Forgot password?</a>
                </div>
                <div class="relative">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        placeholder="••••••••"
                        class="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl text-slate-900 placeholder-slate-400 focus:outline-none focus:border-slate-900 focus:ring-1 focus:ring-slate-900 focus:bg-white transition-colors"
                    >
                </div>
            </div>

            <!-- Remember Me -->
            <div class="flex items-center">
                <input
                    type="checkbox"
                    id="remember"
                    name="remember"
                    class="w-4 h-4 rounded border-slate-300 text-slate-900 bg-slate-50 focus:ring-0 focus:ring-offset-0 cursor-pointer"
                >
                <label for="remember" class="ml-2.5 text-sm text-slate-600 cursor-pointer select-none">
                    Remember me for 30 days
                </label>
            </div>

            <!-- Submit Button -->
            <button
                type="submit"
                class="w-full py-3 px-4 bg-slate-900 hover:bg-slate-800 text-white font-semibold rounded-xl transition-colors shadow-md active:scale-[0.99] transform"
            >
                Sign In
            </button>
        </form>

        <!-- Footer -->
        <div class="mt-8 text-center text-xs text-slate-400">
            Protected area. Unauthorized access is strictly prohibited.
        </div>
    </div>

</body>
</html>
