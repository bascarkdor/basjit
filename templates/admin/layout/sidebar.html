<script>
    function toggleOrdersDropdown() {
        const menu = document.getElementById('ordersDropdownMenu');
        const arrow = document.getElementById('ordersDropdownArrow');
        if (menu.classList.contains('hidden')) {
            menu.classList.remove('hidden');
            arrow.classList.add('rotate-180');
        } else {
            menu.classList.add('hidden');
            arrow.classList.remove('rotate-180');
        }
    }

    document.addEventListener("DOMContentLoaded", () => {
        const currentPath = window.location.pathname;
        const navLinks = document.querySelectorAll('.nav-link');
        const isOrdersPath = currentPath.startsWith('/admin/orders');

        if (isOrdersPath) {
            const menu = document.getElementById('ordersDropdownMenu');
            const arrow = document.getElementById('ordersDropdownArrow');
            if (menu) menu.classList.remove('hidden');
            if (arrow) arrow.classList.add('rotate-180');
        }

        navLinks.forEach(link => {
            const href = link.getAttribute('href');
            if (href === currentPath) {
                // Active styles
                link.classList.add('bg-blue-600', 'text-white', 'font-semibold');
                link.classList.remove('text-slate-400', 'text-slate-300');
            } else {
                // Inactive styles
                if (!link.classList.contains('bg-blue-600')) {
                    link.classList.add('text-slate-400', 'hover:bg-slate-800/60', 'hover:text-white');
                }
            }
        });
    });
</script>
