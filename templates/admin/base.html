<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dashboard App{% endblock %}</title>
    <!-- Tailwind CSS v4 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col md:flex-row">

    <!-- Sidebar Fragment -->
    {% include 'admin/layout/sidebar.html' %}

    <!-- Main Container Layout Block -->
    <div class="flex-1 flex flex-col min-w-0 min-h-screen">

    {% include 'admin/layout/header.html' %}

        <!-- Dynamic Content Space -->
        <main class="flex-1 p-6 md:p-8 overflow-y-auto">
            <div class="max-w-7xl mx-auto">
                {% block content %}
                <!-- Placeholder Fallback UI -->
                <div class="border-4 border-dashed border-slate-200/80 rounded-2xl p-12 text-center text-slate-400">
                    <h2 class="text-2xl font-extrabold text-slate-700 mb-2">Welcome Back!</h2>
                    <p class="text-sm">Your main workspace content will inject right here.</p>
                </div>
                {% endblock %}
            </div>
        </main>

        <!-- Footer Fragment -->
        {% include 'admin/layout/footer.html' %}
    </div>
    <dialog id="universalModal" class="p-0 rounded-2xl shadow-xl border border-slate-200 backdrop:bg-slate-900/50 w-full max-w-lg m-auto">
    <div class="p-6">
        <div class="flex items-center justify-between mb-6">
            <h2 id="modalTitle" class="text-xl font-bold text-slate-900">Add Item</h2>
            <button onclick="document.getElementById('universalModal').close()" class="text-slate-400 hover:text-slate-600 cursor-pointer">
                <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
            </button>
        </div>

        <form id="universalForm" method="POST" class="space-y-4">
            <div id="modalContent" class="space-y-4"></div>

            <div class="flex justify-end gap-3 mt-8">
                <button type="button" onclick="document.getElementById('universalModal').close()" class="px-4 py-2 text-sm font-semibold text-slate-600 hover:text-slate-900 cursor-pointer">Cancel</button>
                <button type="submit" id="saveButton" class="px-4 py-2 text-sm font-semibold text-white bg-blue-600 rounded-lg hover:bg-blue-500 cursor-pointer">Save</button>
            </div>
        </form>
    </div>
</dialog>

{% block scripts %}{% endblock %}

</body>
</html>
