<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Internal Server Error</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 h-full flex items-center justify-center p-4">
    <div class="max-w-lg w-full bg-white border border-slate-200 rounded-3xl p-8 sm:p-10 shadow-xl text-center space-y-6">
        
        <!-- Error Alert Triangle Icon -->
        <div class="relative w-24 h-24 bg-amber-50 text-amber-600 rounded-full flex items-center justify-center mx-auto border border-amber-100 shadow-inner">
            <svg class="h-12 w-12" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.008v.008H12v-.008Z" />
            </svg>
            <div class="absolute -top-1 -right-1 bg-amber-600 text-white font-black text-xs px-2 py-0.5 rounded-full shadow-xs">
                500
            </div>
        </div>

        <div class="space-y-3">
            <h1 class="text-3xl sm:text-4xl font-black text-slate-900 tracking-tight">
                Internal Server Error
            </h1>
            <p class="text-sm sm:text-base text-slate-500 max-w-md mx-auto leading-relaxed">
                Something went wrong on our server while processing your request. Our technical team is addressing it.
            </p>
        </div>

        <div class="pt-4 flex flex-col sm:flex-row items-center justify-center gap-3">
            <button onclick="window.location.reload()" 
                    class="w-full sm:w-auto bg-slate-900 hover:bg-slate-800 text-white font-bold px-6 py-3.5 rounded-xl text-sm shadow-md transition active:scale-[0.98] text-center cursor-pointer">
                Reload Page
            </button>
            <a href="{{ url_for('user.home') }}" 
               class="w-full sm:w-auto bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold px-6 py-3.5 rounded-xl text-sm transition active:scale-[0.98] text-center">
                Return Home
            </a>
        </div>

    </div>
</body>
</html>
