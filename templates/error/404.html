<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 h-full flex items-center justify-center p-4">
    <div class="max-w-lg w-full bg-white border border-slate-200 rounded-3xl p-8 sm:p-10 shadow-xl text-center space-y-6">
        
        <!-- Animated Badge Icon -->
        <div class="relative w-24 h-24 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center mx-auto border border-blue-100 shadow-inner">
            <svg class="h-12 w-12" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z" />
            </svg>
            <div class="absolute -top-1 -right-1 bg-amber-400 text-slate-950 font-black text-xs px-2 py-0.5 rounded-full shadow-xs">
                404
            </div>
        </div>

        <div class="space-y-3">
            <h1 class="text-3xl sm:text-4xl font-black text-slate-900 tracking-tight">
                Page Not Found
            </h1>
            <p class="text-sm sm:text-base text-slate-500 max-w-md mx-auto leading-relaxed">
                Oops! The page you are looking for might have been removed, renamed, or is temporarily unavailable.
            </p>
        </div>

        <div class="pt-4 flex flex-col sm:flex-row items-center justify-center gap-3">
            <a href="{{ url_for('user.home') }}" 
               class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-3.5 rounded-xl text-sm shadow-md transition active:scale-[0.98] text-center">
                Return to Storefront
            </a>
            <a href="{{ url_for('user.view_products') }}" 
               class="w-full sm:w-auto bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold px-6 py-3.5 rounded-xl text-sm transition active:scale-[0.98] text-center">
                Browse Products
            </a>
        </div>

    </div>
</body>
</html>
